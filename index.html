<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f3ee">
  <meta name="description" content="Guxi11 的个人主页，介绍正在制作的工具与项目。">
  <title>Guxi11 · 个人主页</title>
  <link rel="icon" href="/assets/images/favicon.ico">
  <style>
    :root { color-scheme: light; font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; color: #20231f; background: #f5f3ee; font-synthesis: none; text-rendering: optimizeLegibility; }
    * { box-sizing: border-box; }
    body { margin: 0; min-width: 320px; }
    a { color: inherit; }
    .page { width: min(100% - 40px, 920px); margin: 0 auto; padding: clamp(64px, 12vw, 132px) 0 48px; }
    .eyebrow { margin: 0 0 20px; color: #667267; font-size: .78rem; font-weight: 650; letter-spacing: .14em; text-transform: uppercase; }
    h1 { max-width: 700px; margin: 0; font-size: clamp(2.7rem, 8vw, 5.7rem); line-height: 1.06; letter-spacing: -.065em; }
    .intro { max-width: 620px; margin: 26px 0 0; color: #60665f; font-size: clamp(1.05rem, 2.5vw, 1.24rem); line-height: 1.9; }
    .links { display: flex; flex-wrap: wrap; gap: 10px 22px; margin-top: 24px; color: #4e5d50; font-size: .94rem; }
    .links a { text-decoration-thickness: 1px; text-underline-offset: 4px; }
    h2 { margin: 76px 0 20px; font-size: 1.05rem; letter-spacing: .02em; }
    .projects { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
    .project { display: flex; min-height: 190px; flex-direction: column; align-items: flex-start; padding: 25px; border: 1px solid #dfdfd6; border-radius: 14px; background: #fbfaf7; text-decoration: none; transition: border-color .18s ease, transform .18s ease; }
    .project:hover, .project:focus-visible { transform: translateY(-2px); border-color: #8b9b8a; }
    .project h3 { margin: 0; font-size: 1.15rem; }
    .project p { margin: 12px 0 24px; color: #686e67; font-size: .94rem; line-height: 1.75; }
    .project span { margin-top: auto; color: #526553; font-size: .88rem; }
    footer { margin-top: 72px; color: #858a82; font-size: .82rem; }
    @media (max-width: 600px) { .page { width: min(100% - 32px, 920px); } .projects { grid-template-columns: 1fr; } .project { min-height: 165px; } h2 { margin-top: 58px; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <main class="page">
    <p class="eyebrow">Guxi11 · Personal site</p>
    <h1>你好，我是 Guxi11。</h1>
    <p class="intro">我喜欢把想法做成简单、实用的工具。这里是我的个人主页，收录正在制作和维护的项目。</p>
    <nav class="links" aria-label="个人链接">
      <a href="https://github.com/guxi11">GitHub</a>
      <a href="mailto:guxi11@isanbel.com">联系我</a>
    </nav>
    <section aria-labelledby="projects-title">
      <h2 id="projects-title">项目</h2>
      <div class="projects">
        <a class="project" href="/modeck/">
          <h3>modeck</h3>
          <p>集中管理 AI 编程助手的规则、技能与外部资源，按项目组合工作模式。</p>
          <span>项目介绍与使用指南 →</span>
        </a>
        <a class="project" href="/dingmujing/">
          <h3>定目镜 · Steadeye</h3>
          <p>锁定并放大眼睛画面，帮助看清戴摘隐形眼镜、滴眼药水等操作。</p>
          <span>使用说明、隐私政策与反馈 →</span>
        </a>
      </div>
    </section>
    <footer>© Guxi11</footer>
  </main>
</body>
</html>
