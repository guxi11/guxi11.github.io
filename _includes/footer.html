<footer class="site-footer h-card">

  <div class="container">

    <div class="social-links">
      {%- include social.html -%}
    </div>

    <div class="copyright">
      {%- if site.title -%}
        Copyright © {{ site.title | escape }} {{ site.time | date: '%Y' }}
      {%- endif -%}
    </div>

  </div>

</footer>

{%- assign page = include.page -%}

{% if page.title == 'Archive' %}
<script src="{{ "/assets/js/archive.js" | prepend: site.baseurl }}"></script>
<script>
(function() {
  var tags = document.querySelectorAll('#tag_cloud a[rel]');
  if (!tags.length) return;
  var counts = Array.from(tags).map(function(a) { return parseInt(a.getAttribute('rel')) || 1; });
  var min = Math.min.apply(null, counts);
  var max = Math.max.apply(null, counts);
  tags.forEach(function(a, i) {
    var pct = max === min ? 0.5 : (counts[i] - min) / (max - min);
    a.style.fontSize = (0.8 + pct * 0.55) + 'em';
  });
})();
</script>
{% endif %}

{% if page.catalog %}
<script>
(function() {
  function generateCatalog(selector) {
    var containerSel = '{{ page.multilingual }}' === 'true'
      ? 'div.post-content.active'
      : 'div.post-content';
    var container = document.querySelector(containerSel);
    var list = document.querySelector(selector);
    if (!container || !list) return;

    list.innerHTML = '';
    container.querySelectorAll('h1,h2,h3,h4,h5,h6').forEach(function(h) {
      var a = document.createElement('a');
      a.href = '#' + h.id;
      a.rel = 'nofollow';
      a.textContent = h.textContent;
      var li = document.createElement('li');
      li.className = h.tagName.toLowerCase() + '_nav';
      li.appendChild(a);
      list.appendChild(li);
    });
  }

  generateCatalog('.catalog-body');

  var toggle = document.querySelector('.catalog-toggle');
  if (toggle) {
    toggle.addEventListener('click', function(e) {
      e.preventDefault();
      var catalog = document.querySelector('.side-catalog');
      if (catalog) catalog.classList.toggle('fold');
    });
  }

  // IntersectionObserver for active TOC link
  var links = Array.from(document.querySelectorAll('.catalog-body a'));
  if (links.length && 'IntersectionObserver' in window) {
    var observer = new IntersectionObserver(function(entries) {
      entries.forEach(function(entry) {
        if (entry.isIntersecting) {
          var id = '#' + entry.target.id;
          links.forEach(function(a) {
            a.parentElement.classList.toggle('active', a.getAttribute('href') === id);
          });
        }
      });
    }, { rootMargin: '-10% 0px -75% 0px' });

    document.querySelectorAll('div.post-content h1,div.post-content h2,div.post-content h3,div.post-content h4,div.post-content h5,div.post-content h6').forEach(function(h) {
      if (h.id) observer.observe(h);
    });
  }

  // Sticky catalog on scroll
  var catalog = document.querySelector('.side-catalog');
  if (catalog && window.innerWidth >= 1200) {
    var masthead = document.querySelector('.masthead');
    var threshold = (masthead ? masthead.offsetHeight : 200) + 41;
    window.addEventListener('scroll', function() {
      catalog.classList.toggle('fixed', window.scrollY > threshold);
    }, { passive: true });
  }
})();
</script>
{% endif %}
